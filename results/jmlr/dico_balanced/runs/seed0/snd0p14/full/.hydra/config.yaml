experiment:
  sampling_device: cuda:0
  train_device: cuda:0
  buffer_device: cpu
  share_policy_params: true
  prefer_continuous_actions: true
  collect_with_grad: false
  parallel_collection: false
  gamma: 0.9
  lr: 5.0e-05
  adam_eps: 1.0e-05
  adam_extra_kwargs: {}
  clip_grad_norm: true
  clip_grad_val: 5.0
  soft_target_update: true
  polyak_tau: 0.005
  hard_target_update_frequency: 5
  exploration_eps_init: 0.8
  exploration_eps_end: 0.01
  exploration_anneal_frames: 1000000
  max_n_iters: 167
  max_n_frames: 10000000
  on_policy_collected_frames_per_batch: 12000
  on_policy_n_envs_per_worker: 120
  on_policy_n_minibatch_iters: 45
  on_policy_minibatch_size: 4096
  off_policy_collected_frames_per_batch: 6000
  off_policy_n_envs_per_worker: 60
  off_policy_n_optimizer_steps: 1000
  off_policy_train_batch_size: 128
  off_policy_memory_size: 1000000
  off_policy_init_random_frames: 0
  off_policy_use_prioritized_replay_buffer: false
  off_policy_prb_alpha: 0.6
  off_policy_prb_beta: 0.4
  evaluation: false
  render: false
  evaluation_interval: 120000
  evaluation_episodes: 200
  evaluation_deterministic_actions: false
  evaluation_static: false
  loggers: []
  project_name: benchmarl
  wandb_extra_kwargs: {}
  create_json: true
  save_folder: null
  restore_file: null
  restore_map_location: null
  checkpoint_interval: 0
  checkpoint_at_end: false
  keep_checkpoints_num: 3
  exclude_buffer_from_checkpoint: false
algorithm:
  share_param_critic: false
  clip_epsilon: 0.2
  entropy_coef: 0.0
  critic_coef: 1.0
  loss_critic_type: l2
  lmbda: 0.9
  scale_mapping: biased_softplus_1.0
  use_tanh_normal: true
  minibatch_advantage: false
task:
  max_steps: 100
  n_agents: 50
  n_food: 50
  share_reward: true
  food_radius: 0.08
  penalise_by_time: false
model:
  name: hetcontrolmlpempirical
  num_cells:
  - 256
  - 256
  activation_class: torch.nn.Tanh
  desired_snd: 0.14
  tau: 0.01
  bootstrap_from_desired_snd: false
  process_shared: true
  probabilistic: null
  scale_mapping: null
  diversity_estimator: full
  diversity_p: 1.0
  diversity_knn_k: 3
  diversity_knn_subsample_envs: 128
  diversity_expander_d: 3
critic_model:
  name: mlp
  num_cells:
  - 256
  - 256
  layer_class: torch.nn.Linear
  activation_class: torch.nn.Tanh
  activation_kwargs: null
  norm_class: null
  norm_kwargs: null
  num_feature_dims: 1
seed: 0
use_action_loss: true
action_loss_lr: 3.0e-05
graph_snd_log_path: ${hydra:runtime.output_dir}/graph_snd_log.csv
graph_snd_posthoc_full_snd_interval: 1
graph_snd_posthoc_full_snd_subsample: 4096
